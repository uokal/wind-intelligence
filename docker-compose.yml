version: "3.8"

services:
  wind-web:
    build:
      context: ./apps/wind-web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - wind-api
    environment:
      - VITE_API_BASE_URL=http://localhost

  wind-api:
    build:
      context: ./apps/wind-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BACKEND_CORS_ORIGINS=["http://localhost"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s